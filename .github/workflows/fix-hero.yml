name: Fix hero title
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '/* hero-title-final */' not in s:
              s = s.replace('</style>', '''\n    /* hero-title-final */\n    main { overflow: visible !important; }\n    .hero { overflow: visible !important; }\n    .hero > .container, .hero-grid, .hero-grid > div { overflow: visible !important; min-height: 0; min-width: 0; }\n    .hero h1#hero-title {\n      display: block !important;\n      width: 100% !important;\n      max-width: 100% !important;\n      overflow: visible !important;\n      height: auto !important;\n      min-height: 0 !important;\n      line-height: 1.16 !important;\n      padding: .22em 0 .30em !important;\n      margin: 0 !important;\n      letter-spacing: -.05em !important;\n      box-sizing: border-box !important;\n      text-wrap: balance !important;\n    }\n    .hero h1#hero-title .gradient {\n      display: inline !important;\n      overflow: visible !important;\n      -webkit-box-decoration-break: clone !important;\n      box-decoration-break: clone !important;\n    }\n    @media (max-width: 720px) {\n      .hero h1#hero-title {\n        font-size: clamp(2.2rem, 10.9vw, 4.2rem) !important;\n        line-height: 1.14 !important;\n        padding: .20em 0 .28em !important;\n      }\n    }\n    @media (max-width: 420px) {\n      .hero h1#hero-title {\n        font-size: clamp(2.05rem, 10.7vw, 3.35rem) !important;\n        line-height: 1.14 !important;\n      }\n    }\n'''+ '</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then git commit -m "fix: force hero title visibility"; git push; fi