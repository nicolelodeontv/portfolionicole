name: Fix responsive layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch responsive CSS
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* Responsive text/layout hardening */'
          css = r'''\n    /* Responsive text/layout hardening */\n    html, body { max-width: 100%; overflow-x: hidden; }\n    .container, .nav, .hero-grid, .section-heading, .project, .project-visual, .project-copy, .split, .experience-item, .education-item, .skills-grid, .skill-group, .contact, .contact-wrap, .contact-links { min-width: 0; }\n    .project-copy, .project-visual-inner, .hero-grid > *, .split > *, .experience-item > *, .education-item > *, .contact > * { min-width: 0; }\n    .hero h1, .hero-lead, .section-heading h2, .section-heading p, .split h2, .split p, .project-visual h3, .project-visual p, .project-copy h3, .project-copy p, .experience-item h3, .experience-company, .experience-item li, .education-item h3, .education-school, .skill-group h3, .skill-group p, .contact h2, .contact p, .contact-links a, .footer-row span { overflow-wrap: anywhere; word-break: break-word; }\n    .hero h1, .section-heading h2, .split h2, .project-visual h3, .project-copy h3, .experience-item h3, .education-item h3, .contact h2 { text-wrap: balance; }\n    .nav-links a, .button, .tag, .project-kicker, .project-tools, .project-links, .skill-tools, .skill-tool, .status { max-width: 100%; }\n    .project-links a, .nav-links a, .contact-links a { overflow-wrap: anywhere; }\n    .project-meta, .project-tools, .project-links, .skill-tools, .hero-actions { align-content: flex-start; }\n    @media (max-width: 1100px) {\n      .hero-grid { grid-template-columns: minmax(0, 1.15fr) minmax(260px, .85fr); gap: 44px; }\n      .section-heading { align-items: flex-start; }\n      .section-heading p { flex: 0 1 480px; }\n      .project { gap: 28px; }\n    }\n    @media (max-width: 900px) {\n      .hero-grid, .project, .split { grid-template-columns: minmax(0, 1fr); }\n      .hero-grid { gap: 36px; }\n      .project { gap: 14px; }\n      .project-copy { justify-content: flex-start; }\n      .project-visual { min-height: 320px; }\n      .section-heading { display: block; }\n      .section-heading p { max-width: 70ch; margin-top: 16px; }\n      .experience-item, .education-item { grid-template-columns: minmax(0, .32fr) minmax(0, 1.68fr); gap: 26px; }\n      .split { gap: 42px; }\n      .contact { gap: 30px; }\n    }\n    @media (max-width: 720px) {\n      .container { width: min(calc(100% - 28px), var(--max)); }\n      .nav { gap: 12px; }\n      .brand { min-width: 0; }\n      .brand-type { white-space: normal; }\n      .hero { padding: 76px 0 68px; }\n      .hero-grid { gap: 28px; }\n      .hero h1 { font-size: clamp(2.8rem, 13vw, 4.8rem); line-height: .96; letter-spacing: -.055em; }\n      .hero-lead { font-size: 1rem; line-height: 1.6; }\n      .section { padding: 70px 0; }\n      .section-heading { margin-bottom: 30px; }\n      .section-heading h2, .split h2 { font-size: clamp(2.05rem, 10vw, 3.2rem); line-height: 1.02; }\n      .project-visual { min-height: 280px; padding: 24px; }\n      .project-visual h3 { font-size: clamp(2rem, 10vw, 3.1rem); line-height: .98; }\n      .project-copy { padding: 22px; }\n      .project-copy h3 { font-size: 1.35rem; line-height: 1.15; }\n      .project-copy p { line-height: 1.6; }\n      .project-meta, .project-tools, .project-links { gap: 6px 7px; }\n      .project-links { flex-direction: column; align-items: flex-start; gap: 8px; }\n      .project-link { max-width: 100%; }\n      .experience-item, .education-item { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 24px 0; }\n      .experience-date, .education-date { padding-top: 0; }\n      .skills-grid { gap: 10px; }\n      .skill-group { min-height: 0; padding: 21px; }\n      .contact-wrap { padding: 28px 20px; }\n      .contact { gap: 24px; }\n      .contact-links { width: 100%; }\n      .contact-links a { display: block; }\n      .footer-row { gap: 8px; line-height: 1.5; }\n    }\n    @media (max-width: 420px) {\n      .container { width: min(calc(100% - 22px), var(--max)); }\n      .nav { min-height: 64px; }\n      .nav-links { top: 64px; }\n      .hero h1 { font-size: clamp(2.6rem, 14vw, 4rem); }\n      .button { width: 100%; }\n      .hero-actions { width: 100%; }\n      .hero-actions .button { flex: 1 1 100%; }\n      .project-visual { padding: 20px; min-height: 260px; }\n      .project-visual h3 { font-size: clamp(1.9rem, 10.5vw, 2.8rem); }\n      .project-code { right: 18px; top: 18px; }\n      .contact-wrap { padding: 24px 18px; }\n    }\n'''

          if marker not in text:
              text = text.replace('</style>', css + '  </style>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit layout fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: harden responsive text layout"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-responsive-layout.yml
          git add -A
          git diff --cached --quiet || git commit -m "chore: remove temporary responsive workflow"
          git push
