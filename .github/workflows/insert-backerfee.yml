name: Add BackerFee project card

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  insert-backerfee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Insert BackerFee card
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          if "Backer Fee Assistant" in html:
              print("BackerFee card already present; nothing to do.")
              raise SystemExit(0)

          marker = '''      </div></div></section>\n    <section class="section" id="about"'''
          card = '''        <article class="project-visual backerfee" aria-label="Backer Fee Assistant project visual"><span class="project-code mono">fee<span>://</span>tool</span><div class="project-visual-inner"><span class="project-kicker mono">browser calculator</span><h3>Backer Fee<br>Assistant</h3><p>Live Vercel deployment · static web tool</p></div></article>\n        <article class="project-copy"><h3>Backer Fee Assistant</h3><p>A browser-only calculator for discounted backer fees and customer-ready notes, with instant calculations, discount presets, recent history, reset support, and exact-format copying.</p><div class="project-meta"><span class="tag">HTML / CSS / JS</span><span class="tag">Calculator</span><span class="tag">localStorage</span><span class="tag">Vercel</span></div><div class="project-tools"><span class="project-tools-label">Built with</span><span class="tool">ChatGPT</span><span class="tool">Claude</span><span class="tool">Vercel</span></div><div class="project-links"><a class="project-link" href="https://backerfee.vercel.app/" target="_blank" rel="noreferrer">Live project ↗</a><a class="project-link" href="https://github.com/nicolelodeontv/backerfee" target="_blank" rel="noreferrer">View on GitHub ↗</a></div></article>\n'''

          if marker not in html:
              raise SystemExit("Portfolio project section marker not found.")

          html = html.replace(marker, card + marker, 1)
          path.write_text(html, encoding="utf-8")
      - name: Commit portfolio update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/insert-backerfee.yml
          git commit -m "Add Backer Fee Assistant project card"
          git push
