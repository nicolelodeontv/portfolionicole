name: Fix hero clipping boundary
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const path = 'index.html';
            const marker = '/* Hero overflow final fix */';
            const css = `
    /* Hero overflow final fix */
    main { overflow: visible !important; }
    .hero, .hero-grid, .hero-grid > *, .hero .reveal { overflow: visible !important; }
    .hero h1#hero-title {
      display: block !important;
      max-width: 100% !important;
      overflow: visible !important;
      line-height: 1.14 !important;
      padding: .18em 0 .28em !important;
      margin: 0 !important;
      box-sizing: border-box !important;
      text-wrap: balance !important;
    }
    .hero h1#hero-title .gradient {
      display: inline !important;
      -webkit-box-decoration-break: clone !important;
      box-decoration-break: clone !important;
    }
    @media (max-width: 720px) {
      .hero h1#hero-title {
        font-size: clamp(2.25rem, 11.2vw, 4.35rem) !important;
        line-height: 1.12 !important;
        padding: .16em 0 .24em !important;
      }
    }
    @media (max-width: 420px) {
      .hero h1#hero-title {
        font-size: clamp(2.1rem, 11vw, 3.45rem) !important;
        line-height: 1.12 !important;
      }
    }
`;
            const file = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            if (Array.isArray(file.data)) throw new Error('index.html is a directory');
            const content = Buffer.from(file.data.content, 'base64').toString('utf8');
            if (!content.includes(marker)) {
              const updated = content.replace('</style>', css + '  </style>', 1);
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch: 'main',
                message: 'fix: remove hero clipping boundary',
                content: Buffer.from(updated, 'utf8').toString('base64'),
                sha: file.data.sha
              });
            }
