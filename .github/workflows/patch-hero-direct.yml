name: Apply hero overflow patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final hero CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* Hero overflow final fix */'
          css = '''
    /* Hero overflow final fix */
    main { overflow: visible !important; }
    .hero, .hero-grid, .hero-grid > *, .hero .reveal { overflow: visible !important; }
    .hero h1#hero-title {
      display: block !important;
      max-width: 100% !important;
      overflow: visible !important;
      line-height: 1.14 !important;
      padding: .18em 0 .28em !important;
      margin: 0 !important;
      box-sizing: border-box !important;
      text-wrap: balance !important;
    }
    .hero h1#hero-title .gradient {
      display: inline !important;
      -webkit-box-decoration-break: clone !important;
      box-decoration-break: clone !important;
    }
    @media (max-width: 720px) {
      .hero h1#hero-title { font-size: clamp(2.25rem, 11.2vw, 4.35rem) !important; line-height: 1.12 !important; padding: .16em 0 .24em !important; }
    }
    @media (max-width: 420px) {
      .hero h1#hero-title { font-size: clamp(2.1rem, 11vw, 3.45rem) !important; line-height: 1.12 !important; }
    }
'''
          if marker not in s:
              s = s.replace('</style>', css + '  </style>', 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: prevent hero title clipping completely"
          git push