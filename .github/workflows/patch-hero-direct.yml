name: Force hero title directly
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'index.html';
            const marker = '/* Hero title final fix */';
            const css = `
    /* Hero title final fix */
    .hero h1#hero-title {
      display: block !important;
      max-width: 100% !important;
      overflow: visible !important;
      line-height: 1.1 !important;
      padding: .18em 0 .24em !important;
      margin: 0 !important;
      box-sizing: border-box !important;
    }
    .hero h1#hero-title .gradient {
      display: inline !important;
      background-repeat: no-repeat !important;
      -webkit-box-decoration-break: clone !important;
      box-decoration-break: clone !important;
    }
    @media (max-width: 720px) {
      .hero h1#hero-title { font-size: clamp(2.3rem, 11.5vw, 4.4rem) !important; line-height: 1.08 !important; padding: .16em 0 .22em !important; }
    }
    @media (max-width: 420px) {
      .hero h1#hero-title { font-size: clamp(2.15rem, 11.2vw, 3.5rem) !important; line-height: 1.08 !important; }
    }
`;
            const file = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
            if (Array.isArray(file.data)) throw new Error('index.html resolved as directory');
            const content = Buffer.from(file.data.content, 'base64').toString('utf8');
            if (!content.includes(marker)) {
              const updated = content.replace('</style>', css + '  </style>', 1);
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch: 'main',
                message: 'fix: prevent hero title clipping completely',
                content: Buffer.from(updated, 'utf8').toString('base64'),
                sha: file.data.sha
              });
            }
