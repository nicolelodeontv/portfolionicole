name: Fix title clipping

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch title clipping CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* Title clipping hardening */'
          css = r'''
    /* Title clipping hardening */
    .hero h1,
    .section-heading h2,
    .split h2,
    .project-visual h3,
    .project-copy h3,
    .experience-item h3,
    .education-item h3,
    .contact h2 {
      overflow: visible;
      max-width: 100%;
      padding-block: .08em .12em;
      line-height: 1.08;
      text-wrap: balance;
    }
    .project-visual-inner {
      overflow: visible;
      padding-block: 2px 6px;
    }
    .project-visual {
      overflow: hidden;
    }
    .project-visual h3 {
      margin-block: 0;
      line-height: 1.02;
    }
    @media (max-width: 900px) {
      .hero h1 { line-height: 1.02; }
      .project-visual h3 { line-height: 1.04; }
      .section-heading h2,
      .split h2,
      .contact h2 { line-height: 1.06; }
    }
    @media (max-width: 720px) {
      .hero h1 {
        font-size: clamp(2.65rem, 12.5vw, 4.7rem);
        line-height: 1.03;
        padding-block: .05em .14em;
      }
      .project-visual h3 {
        font-size: clamp(1.95rem, 9.4vw, 3rem);
        line-height: 1.05;
        padding-block: .04em .1em;
      }
      .section-heading h2,
      .split h2,
      .contact h2 {
        line-height: 1.06;
        padding-block: .04em .12em;
      }
    }
    @media (max-width: 420px) {
      .hero h1 { font-size: clamp(2.45rem, 12.8vw, 4rem); }
      .project-visual h3 { font-size: clamp(1.82rem, 9.2vw, 2.65rem); }
    }
'''
          if marker not in text:
              text = text.replace('</style>', css + '  </style>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: prevent title clipping on desktop and mobile"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-title-clipping.yml
          git add -A
          git diff --cached --quiet || git commit -m "chore: remove temporary title workflow"
          git push
