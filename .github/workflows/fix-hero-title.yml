name: Force hero title fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix hero title
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old='.hero h1{margin:0;max-width:900px;font-size:clamp(3.3rem,7.7vw,6.8rem);line-height:.94;letter-spacing:-.068em;font-weight:800}'; new='.hero h1{margin:0;max-width:900px;font-size:clamp(3.15rem,7vw,6.2rem);line-height:1.08;letter-spacing:-.055em;font-weight:800;padding:.12em 0 .18em;overflow:visible}'; s=s.replace(old,new); s=s.replace('.hero h1 .gradient{background:linear-gradient(105deg,var(--cyan),#8aa0ff 52%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}', '.hero h1 .gradient{background:linear-gradient(105deg,var(--cyan),#8aa0ff 52%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-box-decoration-break:clone;box-decoration-break:clone}') if old in s else s; p.write_text(s,encoding='utf-8')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: force hero title visibility"
          git push
